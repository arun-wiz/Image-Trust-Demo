name: Build, scan, and publish

on:
  push:
    branches:
      - staging
      - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directory-scan:
    name: Scan source with Wiz
    uses: arun-wiz/wiz-workflows/.github/workflows/wiz-dir-scan.yml@63f6022dbbc90eb42a53cef4f32c5607f0e438ec # v1
    with:
      scan_types: all
      path: .
      policy_profile: auto
      publish: true
      fail_on_policy: true
    secrets:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

  image:
    name: Build, scan, and publish image
    needs: directory-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      REPORT_DIR: /tmp/wiz-image-reports
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN ECR_REGISTRY ECR_REPOSITORY; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub configuration: $name" >&2; exit 2; }
          done

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_URI" .

      - name: Scan image with Wiz
        id: wiz_scan
        uses: arun-wiz/wiz-workflows/.github/actions/wiz-image-scan@63f6022dbbc90eb42a53cef4f32c5607f0e438ec # v1
        with:
          image: ${{ env.IMAGE_URI }}
          scan_types: all
          dockerfile: Dockerfile
          policy_profile: auto
          publish: "true"
          fail_on_policy: "true"
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push scanned image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI" 2>&1 | tee "$REPORT_DIR/docker-push.log"

          digest=""
          for _ in $(seq 1 5); do
            digest=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)
            [[ "$digest" == sha256:* ]] && break
            sleep 2
          done
          [[ "$digest" == sha256:* ]] || { echo "Could not resolve pushed image digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Add pushed digest to Wiz Image Trust
        id: wiz_tag
        uses: arun-wiz/wiz-workflows/.github/actions/wiz-image-tag@63f6022dbbc90eb42a53cef4f32c5607f0e438ec # v1
        with:
          image: ${{ env.IMAGE_URI }}
          image_digest: ${{ steps.push.outputs.digest }}
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Confirm trusted image
        env:
          TRUSTED_IMAGE_TAGGED: ${{ steps.wiz_tag.outputs.trusted_image_tagged }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_IMAGE_TAGGED" == "true" ]] || { echo "Image Trust tagging was not confirmed" >&2; exit 1; }
          {
            echo "## Published trusted image"
            echo
            echo "\`$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST\`"
            echo
            echo "Release tag: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of ECR
        if: always()
        continue-on-error: true
        shell: bash
        run: docker logout "$ECR_REGISTRY"

      - name: Upload Wiz image reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('wiz-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
