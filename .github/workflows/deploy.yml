name: Scan and deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR image tag to scan and deploy (normally a commit SHA)
        required: true
        type: string
      eks_cluster_name:
        description: Name of the target EKS cluster
        required: true
        type: string
      eks_region:
        description: AWS region containing the EKS cluster
        required: true
        default: ap-southeast-1
        type: string
      kubernetes_namespace:
        description: Kubernetes namespace for the application
        required: true
        default: image-trust-demo
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.eks_cluster_name }}-${{ inputs.kubernetes_namespace }}
  cancel-in-progress: false

jobs:
  scan-image:
    name: Pull, scan, and trust ECR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      image_digest: ${{ steps.image.outputs.digest }}
      trusted_image_tagged: ${{ steps.wiz_tag.outputs.trusted_image_tagged }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REPORT_DIR: /tmp/wiz-image-reports
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN ECR_REGISTRY ECR_REPOSITORY IMAGE_TAG; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub configuration: $name" >&2; exit 2; }
          done
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "image_tag is not a valid container tag" >&2
            exit 2
          }
          mkdir -p "$REPORT_DIR"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          [[ "$digest" == sha256:* ]] || { echo "Could not resolve ECR image digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Pull image from ECR
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_URI"

      - name: Scan image with Wiz
        uses: arun-wiz/wiz-workflows/.github/actions/wiz-image-scan@v1
        with:
          image: ${{ steps.image.outputs.uri }}
          scan_types: all
          dockerfile: ""
          publish: "true"
          fail_on_policy: "true"
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Refresh Wiz Image Trust registration
        id: wiz_tag
        uses: arun-wiz/wiz-workflows/.github/actions/wiz-image-tag@v1
        with:
          image: ${{ steps.image.outputs.uri }}
          image_digest: ${{ steps.image.outputs.digest }}
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Log out of ECR
        if: always()
        continue-on-error: true
        shell: bash
        run: docker logout "$ECR_REGISTRY"

      - name: Upload Wiz image reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('wiz-deploy-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy approved digest to EKS
    needs: scan-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ inputs.eks_cluster_name }}
      EKS_REGION: ${{ inputs.eks_region }}
      KUBERNETES_NAMESPACE: ${{ inputs.kubernetes_namespace }}
      IMAGE_URI: ${{ needs.scan-image.outputs.image_uri }}
      TRUSTED_IMAGE_TAGGED: ${{ needs.scan-image.outputs.trusted_image_tagged }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN EKS_CLUSTER_NAME EKS_REGION KUBERNETES_NAMESPACE IMAGE_URI; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub configuration: $name" >&2; exit 2; }
          done
          [[ "$EKS_CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]] || {
            echo "eks_cluster_name is invalid" >&2
            exit 2
          }
          [[ "$EKS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]] || {
            echo "eks_region is invalid" >&2
            exit 2
          }
          [[ "$KUBERNETES_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#KUBERNETES_NAMESPACE} -le 63 ]] || {
            echo "kubernetes_namespace must be a valid DNS label" >&2
            exit 2
          }
          [[ "$TRUSTED_IMAGE_TAGGED" == "true" ]] || {
            echo "The Wiz tag action did not confirm Image Trust registration" >&2
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.EKS_REGION }}

      - name: Install matching kubectl client
        shell: bash
        run: |
          set -euo pipefail
          cluster_version=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$EKS_REGION" \
            --query 'cluster.version' \
            --output text)
          [[ "$cluster_version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Could not determine EKS version" >&2; exit 1; }
          kubectl_url="https://dl.k8s.io/release/v${cluster_version}.0/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error --output /tmp/kubectl "$kubectl_url"
          curl --fail --location --silent --show-error --output /tmp/kubectl.sha256 "${kubectl_url}.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod 0755 /tmp/kubectl
          echo /tmp >> "$GITHUB_PATH"

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$EKS_REGION" \
            --alias image-trust-demo
          kubectl version --client
          kubectl get ingressclass alb > /dev/null || {
            echo "IngressClass 'alb' is missing. Install the AWS Load Balancer Controller first." >&2
            exit 1
          }

      - name: Deploy application and public ALB ingress
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "$KUBERNETES_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|IMAGE_URI_PLACEHOLDER|$IMAGE_URI|g" k8s/application.yaml |
            kubectl --namespace "$KUBERNETES_NAMESPACE" apply -f -
          kubectl --namespace "$KUBERNETES_NAMESPACE" rollout status \
            deployment/image-trust-demo --timeout=5m

      - name: Wait for public ALB
        shell: bash
        run: |
          set -euo pipefail
          alb_hostname=""
          for _ in $(seq 1 60); do
            alb_hostname=$(kubectl --namespace "$KUBERNETES_NAMESPACE" get ingress image-trust-demo \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [[ -n "$alb_hostname" ]] && break
            sleep 10
          done
          [[ -n "$alb_hostname" ]] || {
            kubectl --namespace "$KUBERNETES_NAMESPACE" describe ingress image-trust-demo
            echo "The AWS Load Balancer Controller did not publish an ALB hostname within 10 minutes" >&2
            exit 1
          }
          {
            echo "## Deployed image"
            echo
            echo "\`$IMAGE_URI\`"
            echo
            echo "Public URL: http://$alb_hostname"
          } >> "$GITHUB_STEP_SUMMARY"
