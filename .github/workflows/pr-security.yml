name: PR security checks

on:
  pull_request:
    branches:
      - main
      - staging
      - production

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  directory-scan:
    name: Scan source with Wiz
    uses: arun-wiz/wiz-workflows/.github/workflows/wiz-dir-scan.yml@main
    with:
      scan_types: all
      path: .
      policy_profile: auto
      publish: true
      fail_on_policy: true
    secrets:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

  image-scan:
    name: Build and scan image with Wiz
    needs: directory-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: image-trust-demo:pr-${{ github.event.pull_request.number }}
      REPORT_DIR: /tmp/wiz-pr-image-reports
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME" .

      - name: Scan image with Wiz
        uses: arun-wiz/wiz-workflows/.github/actions/wiz-image-scan@main
        with:
          image: ${{ env.IMAGE_NAME }}
          scan_types: all
          dockerfile: Dockerfile
          policy_profile: auto
          publish: "true"
          fail_on_policy: "true"
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Upload Wiz image reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('wiz-pr-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
